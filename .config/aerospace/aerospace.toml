start-at-login = true

after-login-command = []
after-startup-command = []

exec-on-workspace-change = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 24

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = "qwerty"

[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.bottom = 12
outer.top = 12
outer.right = 12

[mode.main.binding]

# Layout
alt-e = "layout tiles horizontal vertical"
alt-shift-space = "layout floating tiling"
alt-w = "fullscreen"

# Focus
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# Move window
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Resize
alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

# Workspaces
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"

# Move window to workspace and follow it
alt-shift-1 = ["move-node-to-workspace 1", "workspace 1"]
alt-shift-2 = ["move-node-to-workspace 2", "workspace 2"]
alt-shift-3 = ["move-node-to-workspace 3", "workspace 3"]
alt-shift-4 = ["move-node-to-workspace 4", "workspace 4"]
alt-shift-5 = ["move-node-to-workspace 5", "workspace 5"]
alt-shift-6 = ["move-node-to-workspace 6", "workspace 6"]
alt-shift-7 = ["move-node-to-workspace 7", "workspace 7"]

# Workspace navigation
alt-tab = "workspace-back-and-forth"
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"

# App launchers
alt-b = ['workspace 1', 'exec-and-forget open -a "Zen"']
alt-f = 'exec-and-forget open -a "Finder"'
alt-q = ['workspace 2', 'exec-and-forget open -a "WezTerm"']
alt-s = ['workspace 3', 'exec-and-forget open -a "LOOP"']
alt-t = ['workspace 3', 'exec-and-forget open -a "Telegram"']
alt-c = ['workspace 2', 'exec-and-forget open -a "Zed"']
alt-g = "workspace 5"

# Service mode
alt-shift-semicolon = "mode service"

[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]
f = ["layout floating tiling", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

alt-shift-h = ["join-with left", "mode main"]
alt-shift-j = ["join-with down", "mode main"]
alt-shift-k = ["join-with up", "mode main"]
alt-shift-l = ["join-with right", "mode main"]

down = "volume down"
up = "volume up"
shift-down = ["volume set 0", "mode main"]

# ---------- Window rules ----------

# Finder лучше не тайлить
[[on-window-detected]]
if.app-id = "com.apple.finder"
run = ["layout floating"]

# System Settings тоже лучше floating
[[on-window-detected]]
if.app-id = "com.apple.systempreferences"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "hossin.asaadi.V2Box"
run = ["layout floating"]

# Roles: browser / code / comms / AI
[[on-window-detected]]
if.app-id = "app.zen-browser.zen"
run = ["move-node-to-workspace 1"]

[[on-window-detected]]
if.app-id = "org.wezfurlong.wezterm"
run = ["move-node-to-workspace 2"]

[[on-window-detected]]
if.app-id = "dev.zed.Zed"
run = ["move-node-to-workspace 2"]

[[on-window-detected]]
if.app-id = "Loop.Desktop"
run = ["move-node-to-workspace 3"]

[[on-window-detected]]
if.app-id = "ru.keepcoder.Telegram"
run = ["move-node-to-workspace 3"]

[[on-window-detected]]
if.app-id = "com.openai.chat"
run = ["move-node-to-workspace 5"]

[[on-window-detected]]
if.app-id = "com.openai.codex"
run = ["move-node-to-workspace 5"]

# ---------- Workspace -> monitor mapping ----------

[workspace-to-monitor-force-assignment]
1 = "main"
2 = "main"
3 = "main"
4 = "main"
5 = "secondary"
6 = "secondary"
7 = "secondary"
