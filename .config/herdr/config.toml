# Managed in ~/dotfiles; symlink only this file into ~/.config/herdr/.
onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
# Press Ctrl-B, release Ctrl, then press the action key (English or Russian layout).
# Cmd shortcuts stay with Ghostty; Option shortcuts stay with AeroSpace.
prefix = "ctrl+b"

# Tabs: create, close, cycle, select by number.
new_tab = ["prefix+c", "prefix+с"]
close_tab = ["prefix+shift+x", "prefix+shift+ч"]
previous_tab = ["prefix+p", "prefix+з"]
next_tab = ["prefix+n", "prefix+т"]
switch_tab = "prefix+1..9"
rename_tab = ["prefix+shift+t", "prefix+shift+е"]

# Workspaces: arrows cycle; w opens the workspace navigator.
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
workspace_picker = ["prefix+w", "prefix+ц"]
new_workspace = ["prefix+shift+n", "prefix+shift+т"]
rename_workspace = ["prefix+shift+w", "prefix+shift+ц"]
close_workspace = ["prefix+shift+d", "prefix+shift+в"]

# Agents: arrows cycle; g opens the session navigator.
previous_agent = "prefix+left"
next_agent = "prefix+right"
goto = ["prefix+g", "prefix+п"]

# - splits and ? opens help, as in the built-in defaults.
detach = ["prefix+q", "prefix+й"]
reload_config = ["prefix+shift+r", "prefix+shift+к"]

# Built-in defaults, repeated to add the Russian layout.
settings = ["prefix+s", "prefix+ы"]
open_notification_target = ["prefix+o", "prefix+щ"]
new_worktree = ["prefix+shift+g", "prefix+shift+п"]
rename_pane = ["prefix+shift+p", "prefix+shift+з"]
edit_scrollback = ["prefix+e", "prefix+у"]
focus_pane_left = ["prefix+h", "prefix+р"]
focus_pane_down = ["prefix+j", "prefix+о"]
focus_pane_up = ["prefix+k", "prefix+л"]
focus_pane_right = ["prefix+l", "prefix+д"]
split_vertical = ["prefix+v", "prefix+м"]
close_pane = ["prefix+x", "prefix+ч"]
zoom = ["prefix+z", "prefix+я"]
resize_mode = ["prefix+r", "prefix+к"]
toggle_sidebar = ["prefix+b", "prefix+и"]

# Open the active pane's directory in Finder
[[keys.command]]
key = ["prefix+f", "prefix+а"]
type = "shell"
command = 'open "$HERDR_ACTIVE_PANE_CWD"'

# Close all other panes in the current tab
[[keys.command]]
key = ["prefix+shift+o", "prefix+shift+щ"]
type = "shell"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -n1 herdr pane close'''

# Open lazygit in a new pane
[[keys.command]]
key = ["prefix+shift+l", "prefix+shift+д"]
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && lazygit'

[ui]
confirm_close = false
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
status_indicators = "dots"
hide_tab_bar_when_single_tab = true
window_title = "{workspace}: {terminal_title}"

[ui.toast]
delivery = "system"

# Show Claude's session title instead of the agent name
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[experimental]
pane_history = true
