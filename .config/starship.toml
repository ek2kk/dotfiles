add_newline = true
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext = "#bac2de"
overlay = "#6c7086"
surface = "#313244"

[username]
show_always = false
style_user = "bold mauve"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold peach"
format = "on [$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold lavender"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[python]
symbol = " "
style = "bold green"
format = "[${symbol}${pyenv_prefix}${version}](bold green) [($virtualenv)](green) "
pyenv_version_name = true
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "environment.yml", "Pipfile"]

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "
detect_files = ["package.json", "pnpm-lock.yaml", "yarn.lock"]

[rust]
symbol = " "
style = "bold peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold sky"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "bold sapphire"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
